Mãe,

Feliz Dia das Mães! Hoje, quero tirar um momento para agradecer por tudo o que você é e por tudo o que representa na minha vida e na de toda a nossa família.

Quando olho para a nossa história, fico maravilhado com a sua força. A coragem que você demonstrou ao aceitar a nobre e desafiadora missão de ter e criar nove filhos é algo que me inspira profundamente. Foi você quem me ensinou a ler, plantando ali a semente para o meu amor pelos estudos e pela leitura, que moldaram tanto de quem eu sou hoje. Sem falar na sua comida, que é simplesmente a melhor que existe e sempre teve o dom de nos confortar e de buscar nos reunir em volta da mesa, em passeios familiares, projetos de serviço, leitura das escrituras e outras coisas citadas na Proclamação ao Mundo.

Esse seu cuidado e dedicação vão muito além do dia a dia. Mesmo que a minha casa na roça ainda não esteja de pé, eu nunca vou me esquecer de ver você ali, lado a lado comigo, suando para capinar o mato e ajudar a cavar o alicerce. Você sempre constrói conosco não só paredes, mas o alicerce das nossas vidas.

Durante a minha missão e nos anos em que morei fora, você me fortaleceu de uma forma incalculável. Seus conselhos foram um verdadeira fortaleza e um legado que carreguei comigo. É incrível pensar que a sua sabedoria guiou não apenas a mim, mas também ajudou muitas das pessoas que conviveram comigo, amigos, companheiros de missão, pessoas a quem liderei nas alas em que passei em São Paulo e Curitiba. O seu exemplo de dedicação aos chamados e às designações de Deus na Igreja sempre me motivou a ser alguém melhor. Sempre vi você servindo ao próximo com amor genuíno. Lembro-me de quando você proporcionou às pessoas daqui uma experiência semelhante à de um Armazém do Bispo, algo que normalmente só vemos onde a Igreja é mais forte. Você abençoou a vida de tantas famílias distribuindo agasalhos e roupas, mostrando na prática o que significa viver o evangelho. Graças a você, aprendi a importância desse conhecimento, e hoje sei que esse é o maior tesouro de fé que poderíamos receber.

O Élder Jeffrey R. Holland disse certa vez que "nenhum amor na mortalidade chega mais perto do puro amor de Jesus Cristo do que o amor abnegado que uma mãe tem por seu filho". Eu vejo o puro amor de Cristo refletido em você todos os dias, tanto na nossa família quanto na caridade que você tem pelos outros. Assim como os jovens guerreiros de Helamã podiam confiar no que aprenderam em casa, eu também posso dizer com toda a certeza: nós não duvidamos de que a nossa mãe sabia.

Como diz a sua bênção patriarcal, é profético que você deixará um legado duradouro e que seus ensinamentos serão lembrados pela sua posteridade por muito tempo. Já vejo isso se cumprindo. Foi graças às lembranças que criamos juntos que comecei a desenvolver o dom do desenho, um incentivo que mudou a vida de todos nós em casa, inspirando os meus irmãos que hoje também vivem dessa área. Tudo começou com você.

Obrigado por ser essa mãe incansável, que sempre busca apoiar e fazer de tudo para que os filhos tenham sucesso. Que você seja muito feliz, que concretize todos os seus sonhos e que possamos continuar criando e colecionando boas lembranças, escolhendo sempre fazer com que os momentos simples se tornem inesquecíveis.

Eu te amo muito. Nós te amamos!

Com todo amor,

William Mercês
